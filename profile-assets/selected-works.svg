<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Akshat Singh Kushwaha, selected works</title>
  <desc id="desc">An ivory archival label with cherry-red botanical linework and a small retrieval diagram.</desc>

  <defs>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.65" fill="#7f1d1d" opacity="0.09"/>
      <circle cx="13" cy="11" r="0.45" fill="#5c4038" opacity="0.08"/>
    </pattern>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#9f1239" stroke-width="0.55" opacity="0.16"/>
    </pattern>
    <clipPath id="plate"><rect x="14" y="14" width="1172" height="332" rx="2"/></clipPath>
  </defs>

  <rect width="1200" height="360" fill="#f3ece3"/>
  <rect width="1200" height="360" fill="url(#paper)"/>
  <rect x="14" y="14" width="1172" height="332" rx="2" fill="none" stroke="#8f1838" stroke-width="2"/>
  <rect x="22" y="22" width="1156" height="316" rx="1" fill="none" stroke="#ba6c79" stroke-width="0.8"/>
  <path d="M43 39h315M842 39h315M43 321h315M842 321h315" stroke="#8f1838" stroke-width="1"/>
  <circle cx="600" cy="38" r="3" fill="#8f1838"/><circle cx="600" cy="322" r="3" fill="#8f1838"/>

  <g clip-path="url(#plate)" fill="none" stroke="#8f1838" stroke-linecap="round" stroke-linejoin="round">
    <!-- restrained botanical engraving -->
    <path d="M67 310C92 266 105 220 109 169C112 125 103 85 79 48" stroke-width="1.5"/>
    <path d="M104 212c-26-2-43-15-50-38c27-1 44 12 50 38zM108 165c23-8 40-28 41-52c-24 7-39 25-41 52zM93 258c-23 1-40-10-50-31c24-2 41 8 50 31z" stroke-width="1.1" fill="#ead0d3"/>
    <path d="M81 54c-21-11-25-32-11-43c11 2 18 10 20 22c7-11 17-15 29-10c7 15-2 31-25 38z" fill="#e7bbc2" stroke-width="1.3"/>
    <path d="M84 47c7-7 15-12 25-15M86 48c-5-9-9-18-10-28" stroke-width="0.9"/>
    <path d="M29 273c26 9 43 25 50 48M31 286c11-3 23 0 33 8M47 263c10 4 17 12 21 22" stroke-width="0.9" opacity="0.75"/>

    <!-- schematic counterpoint -->
    <g transform="translate(945 76)">
      <rect width="188" height="180" fill="url(#grid)" stroke="#ba6c79" stroke-width="0.8"/>
      <circle cx="38" cy="45" r="8" fill="#f3ece3" stroke-width="1.4"/>
      <circle cx="38" cy="91" r="8" fill="#f3ece3" stroke-width="1.4"/>
      <circle cx="38" cy="137" r="8" fill="#f3ece3" stroke-width="1.4"/>
      <circle cx="106" cy="91" r="11" fill="#ead0d3" stroke-width="1.4"/>
      <circle cx="153" cy="91" r="7" fill="#8f1838" stroke-width="1.2"/>
      <path d="M46 45l51 39M46 91h49M46 137l51-39M117 91h29" stroke-width="1.2"/>
      <path d="M153 72v-9h21M153 110v9h21" stroke-width="0.8"/>
    </g>
  </g>

  <g fill="#4a3431">
    <text x="600" y="83" text-anchor="middle" font-family="Aptos, Segoe UI, sans-serif" font-size="12" letter-spacing="4">A3RO · SELECTED SYSTEMS · Nº 04</text>
    <text x="600" y="157" text-anchor="middle" font-family="Baskerville, Palatino Linotype, Palatino, Georgia, serif" font-size="51" letter-spacing="1">Akshat Singh Kushwaha</text>
    <text x="600" y="195" text-anchor="middle" font-family="Baskerville, Palatino Linotype, Palatino, Georgia, serif" font-size="20" font-style="italic" fill="#8f1838">local software, retrieval systems, and useful experiments</text>
    <text x="600" y="251" text-anchor="middle" font-family="Aptos, Segoe UI, sans-serif" font-size="13" letter-spacing="2.4">QENLO  ·  HYBRIDMIND  ·  LUNA  ·  BITS &amp; BYTES</text>
    <text x="600" y="283" text-anchor="middle" font-family="Aptos, Segoe UI, sans-serif" font-size="10" letter-spacing="3" fill="#8b6c66">ARCHIVE / SOURCE AVAILABLE / 2026</text>
  </g>
</svg>
